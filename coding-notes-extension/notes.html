<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem notes · Atelier</title><link rel="stylesheet" href="notes.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="atelier.css"></head>
<body><main>
  <header><div><small>ATELIER · CODING</small><h1>Practice notebook</h1><p>Your LeetCode and NeetCode history, synced to Atelier.</p></div><div class="actions"><button id="export" type="button">Export JSON</button></div></header>
  <section id="summary"></section>
  <section class="insights-grid"><section class="activity-card"><div class="section-heading"><div><h2>Submission activity</h2><p>Every imported account submission contributes activity.</p></div><span id="activity-total"></span></div><div id="activity" aria-label="One year submission activity graph"></div><div class="activity-legend"><span>Less</span><i></i><i></i><i></i><i></i><i></i><span>More</span></div></section><aside class="retry-card"><div class="section-heading"><div><h2>Retry next</h2><p>Problems most worth another clean attempt.</p></div></div><div id="retry-list"></div></aside></section>
  <section class="toolbar"><input id="search" type="search" placeholder="Search problems, notes, or categories…"><select id="filter"><option value="all">All problems</option><option value="sub20">Sub 20</option><option value="hints">Needed hints</option><option value="understand">Don't understand</option><option value="hole">Hole in one</option></select><div class="view-switch" role="group" aria-label="View"><button data-view="cards" class="active" type="button">Cards</button><button data-view="list" type="button">List</button></div></section>
  <section id="list"></section><p id="empty" hidden>No matching notes yet.</p>
</main>
<dialog id="edit-dialog"><form method="dialog"><div class="dialog-head"><div><small>EDIT PROBLEM</small><h2 id="edit-title"></h2></div><button value="cancel" aria-label="Close" type="submit">×</button></div><input id="edit-key" type="hidden"><div class="edit-grid"><div class="edit-field"><label for="edit-seconds">SOLVE TIME</label><div class="edit-input-group"><input id="edit-seconds" type="number" min="0" step="0.5" placeholder="0" class="edit-value-input"></div><span class="edit-unit">minutes</span></div><div class="edit-field"><label for="edit-count">SUBMISSIONS</label><div class="edit-input-group"><input id="edit-count" type="number" min="0" step="1" class="edit-value-input"></div><p class="auto-count">Auto: <b id="edit-auto-count"></b> <button id="edit-use-auto" type="button">Use</button></p></div></div><div class="edit-flags"><label class="check"><input id="edit-hints" type="checkbox"> Needed hints</label><label class="check"><input id="edit-understand" type="checkbox"> Don't understand</label></div><label class="edit-notes-label">NOTES</label><textarea id="edit-notes" rows="6"></textarea><div class="dialog-actions"><button value="cancel" type="submit">Cancel</button><button id="edit-save" value="default" type="button">Save changes</button></div></form></dialog>
<script src="grouping.js"></script><script src="atelier-sync.js"></script><script src="notes.js"></script></body></html>
